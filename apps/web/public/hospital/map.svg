<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="title desc">
  <title id="title">한빛가상병원 위치</title>
  <desc id="desc">실제 위치와 관계없는 가상 지도. 가운데 한빛가상병원이 있어요.</desc>
  <rect width="360" height="270" rx="12" fill="#f5f6f8"/>
  <g fill="#dde2e7"><rect x="16" y="16" width="116" height="82" rx="8"/><rect x="154" y="16" width="190" height="82" rx="8"/><rect x="16" y="128" width="116" height="126" rx="8"/><rect x="154" y="128" width="190" height="126" rx="8"/></g>
  <path d="M0 113h360M143 0v270" stroke="#fff" stroke-width="18"/>
  <rect x="176" y="146" width="146" height="83" rx="8" fill="#d5eee9" stroke="#0f766e" stroke-width="2"/>
  <g font-family="sans-serif" fill="#202833" text-anchor="middle"><text x="249" y="192" font-size="17" font-weight="bold">한빛가상병원</text><text x="180" y="42" font-size="13">가상 지도 · 실제 위치가 아니에요</text><text x="69" y="225" font-size="14">바통로</text></g>
  <circle cx="143" cy="113" r="17" fill="#0f766e"/><circle cx="143" cy="113" r="6" fill="#fff"/>
