<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="title desc">
<title id="title">한빛가상병원 정적 약도</title><desc id="desc">1 접수 1층, 2 채혈 2층, 3 내과 3층, 4 수납 1층, 5 약국 건물 밖</desc>
<rect width="400" height="330" fill="white"/><g fill="#fff" stroke="#000" stroke-width="3"><rect x="10" y="10" width="380" height="60"/><rect x="10" y="90" width="380" height="60"/><rect x="10" y="170" width="380" height="60"/><rect x="10" y="250" width="380" height="60"/></g>
<g font-size="21" fill="#000"><text x="25" y="50">3층: ③ 내과 외래</text><text x="25" y="130">2층: ② 채혈실</text><text x="25" y="210">1층: ① 접수 → ④ 수납</text><text x="25" y="290">건물 밖: ⑤ 약국</text></g></svg>
