<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
  <title id="title">한빛가상병원 층별 약도</title>
  <desc id="desc">1층 접수와 수납, 2층 채혈실, 3층 내과 외래, 건물 밖 약국의 정적 안내입니다.</desc>
  <rect width="360" height="300" rx="12" fill="#f5f6f8"/>
  <g fill="#fff" stroke="#dde2e7"><rect x="12" y="42" width="336" height="54" rx="8"/><rect x="12" y="106" width="336" height="54" rx="8"/><rect x="12" y="170" width="336" height="54" rx="8"/><rect x="12" y="234" width="336" height="54" rx="8"/></g>
  <g font-family="sans-serif" fill="#202833"><text x="16" y="26" font-size="15" font-weight="bold">층별 위치 · 가상 약도</text><text x="24" y="75" font-size="14">1층</text><text x="103" y="75" font-size="16">접수</text><text x="251" y="75" font-size="16">수납</text><text x="24" y="139" font-size="14">2층</text><text x="103" y="139" font-size="16">채혈실</text><text x="24" y="203" font-size="14">3층</text><text x="103" y="203" font-size="16">내과 외래</text><text x="24" y="266" font-size="13">건물 밖</text><text x="143" y="267" font-size="16">약국</text></g>
  <g fill="#0f766e"><circle cx="83" cy="69" r="12"/><circle cx="231" cy="69" r="12"/><circle cx="83" cy="133" r="12"/><circle cx="83" cy="197" r="12"/><circle cx="122" cy="261" r="12"/></g>
  <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle"><text x="83" y="74">1</text><text x="231" y="74">4</text><text x="83" y="138">2</text><text x="83" y="202">3</text><text x="122" y="266">5</text></g>
</svg>
